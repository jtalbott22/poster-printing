# =====================================================================
#  Shared-host deployment: the portal under a path on an existing vhost,
#  e.g. https://adstare.kent.edu/static/posters/
#
#  Use this INSTEAD of nginx-posters.conf when the portal does not own its
#  own hostname. Paste the two pieces below into the existing site config:
#  the `upstream` block at http level (outside any `server {}`), and the
#  `location` blocks inside the existing `server { listen 443 ... }`.
#
#  The app side needs, in webapp/.env:
#      PUBLIC_URL=https://adstare.kent.edu/static/posters
#  and the Google OAuth client needs the authorised redirect URI:
#      https://adstare.kent.edu/static/posters/auth/google/callback
# =====================================================================

upstream poster_portal {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- inside the existing server { ... } block ------------------------

# `^~` matters. A site with a /static/ prefix usually also has regex
# locations for assets (location ~* \.(js|css|png)$ { ... }), and nginx
# prefers a matching regex over a plain prefix. Without `^~`, requests like
# /static/posters/socket.io/socket.io.js get served (or 404'd) from disk
# instead of reaching the app. `^~` also beats an existing `location /static/`.
#
# proxy_pass has NO path after the upstream name on purpose: the app expects
# to see the full /static/posters/... path and strips it itself (it derives
# the prefix from PUBLIC_URL). Writing `proxy_pass http://poster_portal/;`
# would strip it twice and every route would 404.

location ^~ /static/posters/socket.io/ {
    proxy_pass http://poster_portal;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  7d;
    proxy_send_timeout  7d;
    proxy_buffering off;
}

location ^~ /static/posters/ {
    proxy_pass http://poster_portal;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads — keep a little above MAX_UPLOAD_MB (see nginx-posters.conf).
    client_max_body_size    300m;
    client_body_timeout     600s;
    client_body_buffer_size 1m;
    proxy_request_buffering off;
    proxy_read_timeout      300s;
}

location = /static/posters {
    return 301 /static/posters/;
}
