# =====================================================================
#  /etc/nginx/sites-available/posters.kent.edu
#  ln -s ../sites-available/posters.kent.edu /etc/nginx/sites-enabled/
#  nginx -t && systemctl reload nginx
# =====================================================================

upstream poster_portal {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect plain HTTP. Google OIDC will not accept an http:// redirect URI
# for anything but localhost, so TLS is not optional here.
server {
    listen 80;
    listen [::]:80;
    server_name posters.kent.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name posters.kent.edu;

    ssl_certificate     /etc/ssl/certs/posters.kent.edu.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/posters.kent.edu.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP is set by helmet in the app so it stays in one place.

    access_log /var/log/nginx/posters.access.log;
    error_log  /var/log/nginx/posters.error.log;

    # ------------------------------------------------------------------
    #  Uploads
    # ------------------------------------------------------------------
    # A 250 MB PowerPoint is unusual but not rare once someone embeds
    # uncompressed TIFFs. Keep this a little above MAX_UPLOAD_MB so the app
    # produces the friendly error rather than nginx producing a bare 413.
    client_max_body_size 300m;
    client_body_timeout  600s;
    client_body_buffer_size 1m;
    # Stream to the app instead of spooling the whole upload to disk first;
    # multer writes it once on the far side anyway.
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------
    #  Socket.IO — the live queue
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://poster_portal;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Long-lived by design. Without this nginx cuts the socket at 60s and
        # the console silently stops updating.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    #  Internal file serving
    # ------------------------------------------------------------------
    # The app authorises the request, then hands nginx the path via
    # X-Accel-Redirect so a 400 MB print raster never passes through Node.
    # This location is not reachable from outside — that is what `internal`
    # means, and it is the whole security model here. Do not remove it.
    location /_files/ {
        internal;
        alias /var/lib/poster-portal/;
        add_header Content-Disposition $upstream_http_content_disposition;
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # ------------------------------------------------------------------
    #  Document cameras (optional, FEATURE_CAMERAS=true)
    # ------------------------------------------------------------------
    location /hls/ {
        alias /var/lib/poster-portal/hls/;
        add_header Cache-Control "no-cache";
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        # Only signed-in staff should watch the printers.
        auth_request /api/auth/verify;
    }

    location = /api/auth/verify {
        internal;
        proxy_pass http://poster_portal/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ------------------------------------------------------------------
    #  Everything else
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://poster_portal;
        # Rendering a 151 MP raster can take half a minute. The endpoints that
        # matter are async, but leave room so a slow one returns an error
        # rather than a truncated response.
        proxy_read_timeout 300s;
    }
}
